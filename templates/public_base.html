{% load static %}<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}KPS Studio{% endblock %}</title>
  <script>
    (function () {
      var t = localStorage.getItem('kps-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="public-page">
    <div style="position:fixed; top:1rem; right:1rem; z-index:10;">
      <label class="switch" title="Basculer le thème">
        <input type="checkbox" onchange="toggleTheme()" id="theme-switch">
        <span class="switch__track"></span>
      </label>
    </div>

    {% if messages %}
    <div class="container" style="padding-top:1rem;">
      <ul class="messages">
        {% for message in messages %}
        <li class="message message--{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    </div>
    {% endif %}

    {% block content %}{% endblock %}
  </div>

  <script src="{% static 'js/theme.js' %}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var isDark = (localStorage.getItem('kps-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
      document.getElementById('theme-switch').checked = isDark;
    });
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
